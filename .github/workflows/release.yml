name: Release

# Push a tag to release one package:
#   extension-vX.Y.Z    -> GitHub Release with the .vsix, then the Marketplace and Open VSX
#   vite-plugin-vX.Y.Z  -> npm
# All publish through trusted publishing (GitHub OIDC), so no tokens are stored.
# The trusted publishers on each registry name this file, release.yml.
on:
  push:
    tags: ['extension-v*', 'vite-plugin-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: tag
        run: node scripts/release-tag.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  # Packages the .vsix and puts it on the GitHub Release. Each registry then
  # publishes that same file in its own job, so one registry failing doesn't
  # block the others, and a failed job can be re-run on its own.
  extension:
    needs: [check, test]
    if: needs.check.outputs.package == 'extension'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package
        run: npm run package
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/extension/vibe-visual-editor.vsix --clobber
          else
            node scripts/changelog-section.mjs "$VERSION" > notes.md
            gh release create "$GITHUB_REF_NAME" packages/extension/vibe-visual-editor.vsix \
              --title "Extension $VERSION" --notes-file notes.md
          fi

  marketplace:
    needs: [check, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Marketplace trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.vsix'
      - name: Publish to the Marketplace
        # --skip-duplicate lets a partly failed release be re-run.
        # vsce 4.0.0's --oidc token exchange omits api-version and gets a 400; the fix
        # (microsoft/vscode-vsce c960f2e) is only in prereleases. Drop the pin once 4.0.1 is released.
        run: npx --yes @vscode/vsce@4.0.1-5 publish --oidc --skip-duplicate --packagePath vibe-visual-editor.vsix

  open-vsx:
    needs: [check, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Open VSX trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.vsix'
      - name: Publish to Open VSX
        run: npx ovsx publish --trusted-publishing --skip-duplicate --packagePath vibe-visual-editor.vsix

  vite-plugin:
    needs: [check, test]
    if: needs.check.outputs.package == 'vite-plugin'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Publish to npm
        # prepublishOnly builds the package. Provenance is added automatically.
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if npm view "@vibe-visual-editor/vite-plugin@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm (re-run)"
          else
            npm publish -w @vibe-visual-editor/vite-plugin
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0 # re-run
          gh release create "$GITHUB_REF_NAME" --title "Vite plugin $VERSION" \
            --notes "Published to npm as [@vibe-visual-editor/vite-plugin@$VERSION](https://www.npmjs.com/package/@vibe-visual-editor/vite-plugin/v/$VERSION)."
